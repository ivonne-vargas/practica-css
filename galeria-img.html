<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Grid</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 2rem;
        }
        .galeria {
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap:1.5rem;
        }
        .galeria-item {
            position:relative;
            overflow:hidden;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .galeria-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display:block;
        }

        .galeria-item h3 {
            padding: 1rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1> Galería de Productos</h1>
    
    <div class="galeria">
        <div class="galeria-item">
         <img src="https://picsum.photos/400/200?random=10" alt="producto 1">
         <h3>Producto 1</h3>
         </div>
        <div class="galeria-item">
         <img src="https://picsum.photos/400/200?random=2" alt="producto 1">
         <h3>Producto 2</h3>
        </div>
        <div class="galeria-item">
         <img src="https://picsum.photos/400/200?random=3" alt="producto 1">
         <h3>Producto 3</h3>
        </div>
        <div class="galeria-item">
         <img src="https://picsum.photos/400/200?random=4" alt="producto 1">
         <h3>Producto 4</h3>
        </div>
        <div class="galeria-item">
         <img src="https://picsum.photos/400/200?random=5" alt="producto 1">
         <h3>Producto 5</h3>
        </div>
        <div class="galeria-item">
         <img src="https://picsum.photos/400/200?random=6" alt="producto 1">
         <h3>Producto 6</h3>
        </div>
    </div>
 
</body>
</html>
