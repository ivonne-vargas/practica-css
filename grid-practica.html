<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Practicando CSS Grid</title>
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      padding: 20px;
    }
    
    .contenedor {
      background-color: #f0f0f0;
      padding: 10px;
      margin-bottom: 30px;
      border: 2px solid #333;
      display: grid;
      grid-template-columns: repeat (auto-fit, minmax(min(250px,100%), 1fr)); min(250px, 100%) /*significa “250px, pero nunca más que el ancho disponible”. Es más largo, pero evita el scroll horizontal */
      gap: 20px 20px;
      
    }

   
   
   
    .item {
      background-color: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
      border: 1px solid white;
    }
    
    /* Aquí irán tus experimentos con Grid */
    
  </style>
</head>
<body>
  <h1>Experimentando con CSS Grid</h1>
  
  <h2>Grid básico</h2>
  <div class="contenedor">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
    <div class="item">9</div>
  </div>
</body>
</html>
